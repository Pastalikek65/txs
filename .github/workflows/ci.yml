name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 30s -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out | tail -10
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=ci" -o txs .
      - run: ./txs --help
      - run: TXS_PLAIN=1 ./txs --help
